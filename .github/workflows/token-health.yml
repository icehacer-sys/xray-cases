# Threads token watchdog.
#
# WHY THIS EXISTS: on 2026-08-09 the long-lived Threads token silently expired 60 days
# after it was minted. Nothing was watching it, so the first symptom was two days of
# dead automation — the publisher could not post (00117 Edwards syndrome was lost) and
# the reply bot 401'd on every cycle until it hit its consecutive-failure abort and sent
# "All jobs have failed".
#
# A Threads long-lived token lasts ~60 days and can be refreshed at any point WHILE IT IS
# STILL VALID (and at least 24h old); each refresh buys another 60 days. Once it has
# actually expired, refresh is rejected and the only cure is a manual re-authorization.
# So the whole game is: never let it reach expiry unnoticed.
#
# This workflow runs daily and does two things:
#   1. REFRESH  — if GH_PAT is configured, it refreshes the token and writes the new value
#                 back to the THREADS_ACCESS_TOKEN secret of every repo in TARGET_REPOS.
#                 A failed refresh or secret update makes this job fail for operator attention.
#   2. ALARM    — with or without GH_PAT, it fails loudly while there is still plenty of
#                 runway, so a broken refresh surfaces as a GitHub notification long before
#                 anything stops posting.
#
# GH_PAT: a fine-grained PAT with "Secrets: read and write" on both repos. Without it this
# workflow still runs and still alarms, it just cannot self-heal.
name: threads-token-health

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC, well before the 19:00 posting window
  workflow_dispatch:

permissions:
  contents: read

env:
  # Repos whose THREADS_ACCESS_TOKEN secret should be kept in sync.
  TARGET_REPOS: "icehacer-sys/xray-cases icehacer-sys/threads-bot"
  # Refresh once the token is older than this. Threads requires >24h; refreshing well
  # before expiry means a few failed days in a row still cannot run us out of runway.
  REFRESH_AFTER_DAYS: "20"
  # Fail the job (and notify) when fewer than this many days remain.
  ALARM_UNDER_DAYS: "14"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate, refresh when due, and alarm
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node tools/token-health.mjs
